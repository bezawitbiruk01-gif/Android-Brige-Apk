plugins {
    id 'com.android.application'
}

android {
    namespace 'com.biruk.androidbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.biruk.androidbridge'
        minSdk 29
        targetSdk 33
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
