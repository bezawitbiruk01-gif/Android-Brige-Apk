name: Build Android Bridge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Node.js for relay validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install relay dependencies
        run: npm install --ignore-scripts

      - name: Syntax check relay
        run: node --check relay/server.js

      - name: Android lint and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
